name: CI

# Three jobs here are required by name on `main`: `test`, the repository's own
# checks; `checks / checks`, the language-neutral checks every repository runs, from
# checks.yml in those-who-run/.github; and `go / check`, the Go checks, from go.yml
# there. A repository with an image also requires `image / build`, from image.yml in
# this directory. Renaming any of them leaves `main` waiting for a check that never
# reports. `web`, the web app's checks, is not required yet: the maintainer adds it
# with `go / check` and `image / build` (those-who-run/.github's scripts/repos.json).
#
# merge_group runs them again on what a merge queue would land, the PR merged onto
# `main` and the PRs ahead of it; a queue whose required checks never report there
# never merges. The release and Scorecard workflows don't run on it.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# Nothing by default; each job asks for what it uses.
permissions: {}

# A new push to a PR cancels its superseded run; runs on main and in the merge
# queue always finish (a queue run has a ref of its own, and the queue would read a
# cancelled run as a failure).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions and the reusable workflows are pinned by commit SHA (the tag in the
# comment); Renovate bumps them (renovate.json). The reusable workflows share one
# pin, so they are bumped together.
jobs:
  # The repository's own checks, the same `make test` a laptop runs: the Go tests
  # with the coverage floor, the Markdown links, the guard copy against .github's
  # agent/ at the commit pinned for checks.yml below, and the tests in tests/.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: make test
        run: make test

  # The web app, the same `make web-check` a laptop runs: ESLint, tsc, the generated
  # client against the pinned contracts tag, Vitest, the build and the bundle budget, on the Node in
  # web/.node-version with web/package-lock.json's packages. Playwright is `e2e`.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make web-check
        run: make web-check

  # The end-to-end tests, `make web-e2e`: Playwright over the built app and the Go
  # API, on NATS and the pinned logbook image serving web/e2e/store's data, with no
  # ecu (those-who-run/paddock#130, the maintainer's decision D8), at the three
  # viewports. The screenshots, and the traces of any failure, are an artifact.
  # Not required yet: the maintainer adds `e2e` with the others
  # (those-who-run/.github's scripts/repos.json).
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make web-deps
        run: make web-deps
      # Chromium and the libraries it needs, at the version package-lock.json pins.
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: make web-e2e
        run: make web-e2e
      - name: Keep the screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: |
            web/test-results/screenshots
            web/test-results/playwright
          if-no-files-found: warn
          retention-days: 14

  # The commit hooks on every file, gitleaks over the PR's commits, the PR title and
  # dependency review. No `if:` or `needs:`, so the required check always reports.
  # The guard copy check reads this pin, so bump the copies in .claude/ with it.
  # The Go hooks (gofmt, go mod tidy, golangci-lint) need Go, installed from go.mod.
  checks:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/checks.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      go-version-file: go.mod

  # gofmt, go mod tidy, go vet, golangci-lint, the tests with the race detector and
  # the coverage floor, go build and govulncheck, as `make check` runs them, behind
  # the Go test guard. The floor is the Makefile's COVERAGE_FLOOR too
  # (tests/test_go_floor.py keeps the two equal).
  go:
    permissions:
      contents: read
      pull-requests: read # the weakened-tests check reads the PR's description
    uses: those-who-run/.github/.github/workflows/go.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      coverage-floor: 90
