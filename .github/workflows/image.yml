name: Image

# The container image on every PR: image.yml in those-who-run/.github builds it from
# the Dockerfile, smoke-tests it and pushes nothing. The job is required by name on
# `main` as `image / build`; renaming the job leaves `main` waiting for a check that
# never reports. A repository without an image deletes this file with the
# Dockerfile, .dockerignore and release.yml (README.md, "Without an image").
#
# It runs in the merge queue too (merge_group), as ci.yml does, and still pushes
# nothing there: this job may only read, and publishing is release.yml's.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# Nothing by default; the job asks for what it uses.
permissions: {}

# As in ci.yml: only a superseded PR run is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The smoke test runs the image as it would be deployed: scripts/image_smoke.sh
  # says what it checks (those-who-run/paddock#131). A PR's build reports `dev`.
  image:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/image.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      smoke: scripts/image_smoke.sh dev
